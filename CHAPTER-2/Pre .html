<!-- 10. Pre Tag:- HTML always ignores extra spaces and newlines. In order to display a piece of text as is, we use pre tag. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pre</title>
</head>
<body>
    <pre>
    Hey
    I
    am       good
    </pre>
</body>
</html>
