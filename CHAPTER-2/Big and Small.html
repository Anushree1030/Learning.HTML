<!-- 7. Big and Small Tag:- We can make text a bit larger and a bit smaller using <big> and <small> tags respectively. -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <big>Hello World</big>
        <small>Hello World</small>
    </body>
    </html>
