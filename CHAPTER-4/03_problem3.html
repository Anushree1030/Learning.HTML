<!-- Create an HTML form for a travel website to book a vacation  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud.com - Book your travel to Bali</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url('https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1600')
                center/cover no-repeat;
}

form{
    width: 100%;
    max-width: 500px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

form::before{
    content: "🌴 Bali Vacation Booking";
    display: block;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: white;
    margin-bottom: 25px;
}

div{
    margin-bottom: 18px;
}

label{
    display: block;
    margin-bottom: 6px;
    color: white;
    font-weight: 600;
}

input,
textarea{
    width: 100%;
    padding: 12px 15px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.9);
    font-size: 15px;
}

input:focus,
textarea:focus{
    outline: none;
    box-shadow: 0 0 10px rgba(0,255,200,0.6);
}

textarea{
    min-height: 100px;
    resize: vertical;
}

button{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,114,255,0.4);
}
</style>
</head>
<body>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name">
        </div>

        <div>
            <label for="age">Age</label>
            <input id="age"  type="'number" placeholder="Enter your age">
        </div>

        <div>
            <label for="phoneno">Phone</label>
            <input id="phoneno" type="phone" placeholder="Enter your phone">
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email">
        </div> 
        <div>
            <label for="add">Address</label>
            <textarea name="Address" id="add"></textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
