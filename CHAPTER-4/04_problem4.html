<!-- Create a table displaying score of cricket players in a match using HTML  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #059669
    );
    padding:30px;
}

table{
    width:850px;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:
        0 20px 40px rgba(0,0,0,0.3),
        0 0 25px rgba(255,255,255,0.1);
}

caption{
    caption-side:top;
    padding:20px;
    font-size:2rem;
    font-weight:700;
    color:white;
    letter-spacing:1px;
}

thead{
    background:linear-gradient(
        90deg,
        #16a34a,
        #22c55e
    );
}

th{
    color:white;
    padding:18px;
    font-size:1.1rem;
    text-transform:uppercase;
    letter-spacing:1px;
}

td{
    padding:18px;
    text-align:center;
    color:white;
    font-size:1rem;
    border-bottom:1px solid rgba(255,255,255,0.15);
}

tbody tr{
    transition:0.35s ease;
}

tbody tr:nth-child(even){
    background:rgba(255,255,255,0.05);
}

tbody tr:hover{
    background:rgba(255,255,255,0.15);
    transform:scale(1.02);
}

tbody tr:hover td{
    color:#fff;
}

td:first-child{
    font-weight:600;
    text-align:left;
    padding-left:30px;
}

td:nth-child(2){
    font-size:1.2rem;
    font-weight:700;
    color:#facc15;
}

tbody tr:first-child td:nth-child(2)::after{
    content:" 🏆";
}

tbody tr:last-child td{
    border-bottom:none;
}

/* Responsive */
@media(max-width:768px){

    table{
        width:100%;
    }

    th,
    td{
        padding:12px;
        font-size:0.9rem;
    }

    caption{
        font-size:1.5rem;
    }
}
</style> 
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Match</th>

        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Virat Kohli</td>
          <td>34</td>
          <td>IPL 2024</td>
        </tr>

        <tr>
          <td>Rohit Sharma</td>
          <td>47</td>
          <td>IPL 2024</td>
        </tr>

        <tr>
          <td>Abhishek Sharma</td>
          <td>28</td>
          <td>IPL 2024</td>
        </tr>


      </tbody>
    </table>
  </body>
</html>
