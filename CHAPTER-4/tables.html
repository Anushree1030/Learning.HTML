<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables - HTML</title>
  </head>
  <style>
    <style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: Arial, sans-serif;
        background-color: #fff5f5;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    th {
        background-color: #d62828;
        color: white;
        padding: 14px;
        text-align: left;
        font-size: 18px;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid #f1c0c0;
        font-size: 16px;
    }

    tr:nth-child(even) {
        background-color: #ffe5e5;
    }

    tr:hover {
        background-color: #ffcccc;
        transition: 0.3s;
    }

    caption {
        font-size: 24px;
        font-weight: bold;
        color: #b71c1c;
        margin-bottom: 10px;
    }
</style>
  </style>

  <body>
    <h1>Tables in HTML</h1>
    <table>
      <!-- Head of the table -->
      <thead>
        <!-- tr -> table row -->
        <tr>
            <!-- th -> table header -->
          <th>Name</th>
          <th>Role</th>
          <th>Salary</th>
        </tr>
      </thead>
      <!-- Body of the table  -->
      <tbody>
        <tr>
            <!-- tr -> table data -->
            <td>Anu</td>
            <td>Software Developer</td>
            <td>$70000</td>
        </tr>

        <tr>
            <!-- tr -> table data -->
            <td>Sam</td>
            <td>Software Helper</td>
            <td>$700</td>
        </tr>

        <tr>
            <!-- tr -> table data -->
            <td>Sid</td>
            <td>AI Engineer</td>
            <td>$10000000</td>
        </tr>

        <tr>
            <td>Thank</td>
            <td colspan="2">YOU</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
<!-- Here, colspan is an attribute  -->
