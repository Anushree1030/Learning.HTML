<!-- Div Tag:- This tag always takes up the full width available. it is also known as block-level element -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>This is a heading inside a div</h1>
        <p>This is a paragraph inside a div</p>
    </div>
        
</body>
</html>

<!-- HTML contains two types of element, one is block level element which takes up the full width available and 
second is inline element which takes space which is only needed -->
