<!-- Create an SEO friendly website using HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zomato - Food delivery at your door step </title>
    <style>/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #fff0f0;
    color: #222;
}

/* Header */
header {
    background: #d62828;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

header div:first-child {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 1px;
}

header a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 17px;
    transition: 0.3s;
}

header a:hover {
    color: #ffd6d6;
}

/* Main Section */
main {
    height: 80vh;
    background: linear-gradient(
        rgba(214, 40, 40, 0.85),
        rgba(255, 77, 77, 0.85)
    );
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

main div {
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 20px;
}

main p {
    max-width: 750px;
    font-size: 20px;
    line-height: 1.8;
}

/* Footer */
footer {
    background: #b71c1c;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 15px;
}</style>
</head>
<body>
    <header>
        <div>Zomato</div>
        <div>
            <a href="/home">Home</a>
            <a href="/about">Abiut us</a>
            <a href="/contact">Contact</a>
        </div>
    </header>
    <main>
        <div>
            Order food anytime, anywhere
        </div>

        <P>For over a decade, we’ve enabled our customers to discover new tastes,
             delivered right to their doorstep</P>
    </main>
    <footer>
        Copyright Zomato All rights rserved
    </footer>
</body>
</html>
